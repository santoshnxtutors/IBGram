name: Deploy IB Gram to CloudPanel VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  DEPLOY_PATH: /home/ibgram/htdocs/www.ibgram.com
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Ports are NOT hardcoded — single source of truth here.
  # Override without editing this file by setting repo Variables
  # (Settings -> Secrets and variables -> Actions -> Variables):
  #   APP_PORT      = CloudPanel "App Port" for Next.js (default 3005)
  #   BACKEND_PORT  = Express backend port (default 4000)
  APP_PORT: ${{ vars.APP_PORT || '3005' }}
  BACKEND_PORT: ${{ vars.BACKEND_PORT || '4000' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate --schema database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/ibgram?schema=public

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    # Deliberately not `needs: lint` - the two ran back to back and lint added 2m18s of
    # wall clock before the build even started. They are independent, so they run in
    # parallel and `deploy` below waits for both, which still blocks a lint failure.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check required build secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for key in DATABASE_URL NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_APP_URL BACKEND_URL CORS_ORIGIN ADMIN_EMAIL ADMIN_USERNAME ADMIN_PASSWORD ADMIN_SESSION_SECRET AUTH_SESSION_SECRET JWT_ACCESS_SECRET JWT_REFRESH_SECRET; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Generate Prisma client
        run: npx prisma generate --schema database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build backend packages
        run: npm run backend:build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_CONNECTION_LIMIT: ${{ secrets.PRISMA_CONNECTION_LIMIT || '3' }}
          PRISMA_POOL_TIMEOUT: ${{ secrets.PRISMA_POOL_TIMEOUT || '30' }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Build Next.js
        run: npm run build
        env:
          # The generated-page stores (Gurgaon ~19MB + India ~5MB of JSON) push the
          # build past Node's default heap; without this it dies with an OOM.
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_UPLOAD_MAX_BYTES: ${{ secrets.NEXT_PUBLIC_UPLOAD_MAX_BYTES || '5242880' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_CONNECTION_LIMIT: ${{ secrets.PRISMA_CONNECTION_LIMIT || '3' }}
          PRISMA_POOL_TIMEOUT: ${{ secrets.PRISMA_POOL_TIMEOUT || '30' }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL || 'https://www.ibgram.com/api/auth/google/callback' }}
          AUTH_SUCCESS_REDIRECT: ${{ secrets.AUTH_SUCCESS_REDIRECT || 'https://www.ibgram.com/' }}
          AUTH_FAILURE_REDIRECT: ${{ secrets.AUTH_FAILURE_REDIRECT || 'https://www.ibgram.com/login?error=oauth_failed' }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          COOKIE_SECURE: "true"
          UPLOAD_PROVIDER: ${{ secrets.UPLOAD_PROVIDER || 'local' }}
          UPLOAD_DIR: public/uploads
          UPLOAD_MAX_BYTES: ${{ secrets.UPLOAD_MAX_BYTES || '5242880' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-5.2' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}

      # Packing first is what makes the upload quick. The payload is ~3,300 files and
      # ~300MB (src/ alone is 285MB of generated SEO JSON), and upload-artifact pays a
      # per-file round trip, which cost 5m08s on run 40300514610. One gzip archive is a
      # single file, so the same bytes upload in a fraction of that.
      #
      # src/ has to ship: next.config.ts imports ./src/lib/gurgaon-seo/pages-data-expansion,
      # so `next start` reads it at runtime. Do not "optimise" it out of this list.
      #
      # .next is hidden, but naming it explicitly in tar includes it - this replaces the
      # include-hidden-files flag the old upload-artifact step needed.
      - name: Pack build output
        run: |
          set -euo pipefail

          # upload-artifact only warned when a path did not exist; tar fails on one, so
          # keep the old lenient behaviour and just skip anything absent.
          paths=()
          for p in \
            .next \
            backend/dist backend/package.json backend/tsconfig.json \
            shared/dist shared/src shared/package.json shared/tsconfig.json \
            authentication/dist authentication/src authentication/package.json authentication/tsconfig.json \
            database public src scripts \
            package.json package-lock.json next.config.ts tsconfig.json .npmrc ecosystem.config.js
          do
            if [ -e "$p" ]; then paths+=("$p"); else echo "skipping missing path: $p"; fi
          done

          test -f .next/BUILD_ID || { echo "::error::.next/BUILD_ID missing - the Next build produced no output"; exit 1; }

          # --exclude drops webpack's build cache. It is a build-time artifact that
          # `next start` never reads, and it was being shipped to the VPS every deploy.
          tar -czf ibgram-build.tar.gz --exclude=.next/cache "${paths[@]}"
          ls -lh ibgram-build.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibgram-build
          retention-days: 1
          # Already gzip-compressed, so zipping it again only burns CPU.
          compression-level: 0
          path: ibgram-build.tar.gz

  deploy:
    name: Deploy to CloudPanel
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ibgram-build
          path: artifact/

      # Unpack into deploy/ so the rsync step below sees the same tree it always has.
      - name: Unpack build output
        run: |
          set -euo pipefail
          mkdir -p deploy
          tar -xzf artifact/ibgram-build.tar.gz -C deploy
          test -f deploy/.next/BUILD_ID
          du -sh deploy

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Check required deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for key in VPS_HOST VPS_USER VPS_SSH_PORT; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ -z "${VPS_SSH_PASSWORD:-}" ] && [ -z "${VPS_SSH_KEY:-}" ]; then
            missing+=("VPS_SSH_PASSWORD or VPS_SSH_KEY")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${VPS_SSH_KEY:-}" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ibgram_deploy_key
            chmod 600 ~/.ssh/ibgram_deploy_key
          fi

          ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare empty CloudPanel folder
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh_options="-p ${VPS_SSH_PORT} -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes"
          if [ -f ~/.ssh/ibgram_deploy_key ]; then
            ssh_options="-i ${HOME}/.ssh/ibgram_deploy_key ${ssh_options}"
          fi

          quoted_deploy_path="$(printf '%q' "$DEPLOY_PATH")"
          remote_prepare="$(cat <<PREPARE
          set -e
          DEPLOY_PATH=${quoted_deploy_path}

          if [ "\$DEPLOY_PATH" != "/home/ibgram/htdocs/www.ibgram.com" ]; then
            echo "Refusing to clean unexpected deploy path: \$DEPLOY_PATH"
            exit 1
          fi

          if command -v pm2 >/dev/null 2>&1; then
            pm2 delete all >/dev/null 2>&1 || true
          fi

          if command -v fuser >/dev/null 2>&1; then
            fuser -k 3000/tcp >/dev/null 2>&1 || true
            fuser -k ${{ env.APP_PORT }}/tcp >/dev/null 2>&1 || true
            fuser -k ${{ env.BACKEND_PORT }}/tcp >/dev/null 2>&1 || true
          fi

          mkdir -p "\$DEPLOY_PATH/public/uploads" /home/ibgram/logs
          find "\$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name public -exec rm -rf {} +
          find "\$DEPLOY_PATH/public" -mindepth 1 -maxdepth 1 ! -name uploads -exec rm -rf {} +
          rm -f "\$DEPLOY_PATH/.env"
          PREPARE
          )"

          if [ -n "${VPS_SSH_PASSWORD:-}" ]; then
            sshpass -e ssh ${ssh_options} "${VPS_USER}@${VPS_HOST}" "$remote_prepare"
          else
            ssh ${ssh_options} "${VPS_USER}@${VPS_HOST}" "$remote_prepare"
          fi

      - name: Rsync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh_options="-p ${VPS_SSH_PORT} -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes"
          if [ -f ~/.ssh/ibgram_deploy_key ]; then
            ssh_options="-i ${HOME}/.ssh/ibgram_deploy_key ${ssh_options}"
          fi

          rsync_cmd=(rsync -az --delete
            --exclude='node_modules'
            --exclude='public/uploads/'
            -e "ssh ${ssh_options}"
            deploy/
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/")

          if [ -n "${VPS_SSH_PASSWORD:-}" ]; then
            sshpass -e "${rsync_cmd[@]}"
          else
            "${rsync_cmd[@]}"
          fi

      - name: Install, prepare database, and restart PM2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          APP_PORT: ${{ env.APP_PORT }}
          BACKEND_PORT: ${{ env.BACKEND_PORT }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_CONNECTION_LIMIT: ${{ secrets.PRISMA_CONNECTION_LIMIT || '3' }}
          PRISMA_POOL_TIMEOUT: ${{ secrets.PRISMA_POOL_TIMEOUT || '30' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          # These are exported to the VPS by the loop below, but were never
          # defined here — so they shipped as empty strings and PM2 baked the
          # blanks in, leaving Google sign-in 503 GOOGLE_AUTH_NOT_CONFIGURED.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL || 'https://www.ibgram.com/api/auth/google/callback' }}
          AUTH_SUCCESS_REDIRECT: ${{ secrets.AUTH_SUCCESS_REDIRECT || 'https://www.ibgram.com/' }}
          AUTH_FAILURE_REDIRECT: ${{ secrets.AUTH_FAILURE_REDIRECT || 'https://www.ibgram.com/login?error=oauth_failed' }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SESSION_TTL: 8h
          ACCESS_TOKEN_TTL: 15m
          REFRESH_TOKEN_TTL: 30d
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          COOKIE_SECURE: "true"
          AUTH_RATE_LIMIT_WINDOW_MS: ${{ secrets.AUTH_RATE_LIMIT_WINDOW_MS || '900000' }}
          AUTH_RATE_LIMIT_MAX: ${{ secrets.AUTH_RATE_LIMIT_MAX || '10' }}
          UPLOAD_PROVIDER: ${{ secrets.UPLOAD_PROVIDER || 'local' }}
          UPLOAD_DIR: public/uploads
          UPLOAD_MAX_BYTES: ${{ secrets.UPLOAD_MAX_BYTES || '5242880' }}
          NEXT_PUBLIC_UPLOAD_MAX_BYTES: ${{ secrets.NEXT_PUBLIC_UPLOAD_MAX_BYTES || '5242880' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-5.2' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'info' }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          # Transactional email (Amazon SES over SMTP)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'IB Gram <noreply@ibgram.com>' }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO || 'support@ibgram.com' }}
          # Google Calendar / Meet for demo classes
          DCC_GOOGLE_ENABLED: ${{ secrets.DCC_GOOGLE_ENABLED || 'true' }}
          DCC_GOOGLE_CALENDAR_ID: ${{ secrets.DCC_GOOGLE_CALENDAR_ID || 'primary' }}
          DCC_GOOGLE_CREDENTIALS_JSON: ${{ secrets.DCC_GOOGLE_CREDENTIALS_JSON }}
          DCC_GOOGLE_ORGANIZER_EMAIL: ${{ secrets.DCC_GOOGLE_ORGANIZER_EMAIL }}
          DCC_GOOGLE_CONFERENCE_POLL_ATTEMPTS: ${{ vars.DCC_GOOGLE_CONFERENCE_POLL_ATTEMPTS || '4' }}
          DCC_GOOGLE_CONFERENCE_POLL_DELAY_SECONDS: ${{ vars.DCC_GOOGLE_CONFERENCE_POLL_DELAY_SECONDS || '1.5' }}
          DCC_GOOGLE_TIMEOUT_SECONDS: ${{ vars.DCC_GOOGLE_TIMEOUT_SECONDS || '12' }}
          # Read by src/app/api/revalidate, admin asset upload and src/lib/db.ts
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          PRISMA_LOG_ERRORS: ${{ vars.PRISMA_LOG_ERRORS || 'true' }}
        run: |
          set -euo pipefail
          ssh_options="-p ${VPS_SSH_PORT} -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes"
          if [ -f ~/.ssh/ibgram_deploy_key ]; then
            ssh_options="-i ${HOME}/.ssh/ibgram_deploy_key ${ssh_options}"
          fi

          emit_export() {
            local key="$1"
            printf 'export %s=' "$key"
            printf '%q' "${!key:-}"
            printf '\n'
          }

          run_remote() {
            if [ -n "${VPS_SSH_PASSWORD:-}" ]; then
              sshpass -e ssh ${ssh_options} "${VPS_USER}@${VPS_HOST}" "bash -s"
            else
              ssh ${ssh_options} "${VPS_USER}@${VPS_HOST}" "bash -s"
            fi
          }

          {
            for key in \
              DEPLOY_PATH \
              NODE_ENV NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_APP_URL APP_PORT BACKEND_PORT BACKEND_URL CORS_ORIGIN \
              DATABASE_URL PRISMA_CONNECTION_LIMIT PRISMA_POOL_TIMEOUT \
              ADMIN_EMAIL ADMIN_USERNAME ADMIN_PASSWORD ADMIN_PASSWORD_HASH ADMIN_SESSION_SECRET \
              GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL AUTH_SUCCESS_REDIRECT AUTH_FAILURE_REDIRECT \
              AUTH_SESSION_SECRET JWT_ACCESS_SECRET JWT_REFRESH_SECRET SESSION_TTL ACCESS_TOKEN_TTL REFRESH_TOKEN_TTL \
              COOKIE_DOMAIN COOKIE_SECURE AUTH_RATE_LIMIT_WINDOW_MS AUTH_RATE_LIMIT_MAX \
              UPLOAD_PROVIDER UPLOAD_DIR UPLOAD_MAX_BYTES NEXT_PUBLIC_UPLOAD_MAX_BYTES \
              CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET \
              AWS_REGION AWS_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
              OPENAI_API_KEY OPENAI_MODEL SENTRY_DSN LOG_LEVEL \
              RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET               SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_REPLY_TO               DCC_GOOGLE_ENABLED DCC_GOOGLE_CALENDAR_ID DCC_GOOGLE_CREDENTIALS_JSON DCC_GOOGLE_ORGANIZER_EMAIL               DCC_GOOGLE_CONFERENCE_POLL_ATTEMPTS DCC_GOOGLE_CONFERENCE_POLL_DELAY_SECONDS DCC_GOOGLE_TIMEOUT_SECONDS               REVALIDATION_SECRET CLOUDINARY_UPLOAD_PRESET PRISMA_LOG_ERRORS; do
              emit_export "$key"
            done

            cat <<'REMOTE_SCRIPT'
            set -euo pipefail

            load_node_path() {
              set +u
              site_home="${DEPLOY_PATH%%/htdocs/*}"

              for profile in /etc/profile "$HOME/.profile" "$HOME/.bash_profile" "$HOME/.bashrc"; do
                if [ -r "$profile" ]; then
                  . "$profile" >/dev/null 2>&1 || true
                fi
              done

              if [ -s "$site_home/.nvm/nvm.sh" ]; then
                . "$site_home/.nvm/nvm.sh"
                nvm use 20 >/dev/null 2>&1 || nvm install 20 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
              fi

              if [ -s "$HOME/.nvm/nvm.sh" ]; then
                . "$HOME/.nvm/nvm.sh"
                nvm use 20 >/dev/null 2>&1 || nvm install 20 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
              fi

              if [ -s "/usr/local/nvm/nvm.sh" ]; then
                . "/usr/local/nvm/nvm.sh"
                nvm use 20 >/dev/null 2>&1 || nvm install 20 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
              fi

              export PATH="$site_home/.npm-global/bin:$site_home/.local/bin:$HOME/.npm-global/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:/snap/bin:$PATH"
              set -u
            }

            load_node_path

            if ! command -v npm >/dev/null 2>&1; then
              echo "npm was not found on the VPS SSH PATH. Install Node.js 20 for this SSH user or add npm to PATH."
              exit 127
            fi

            if command -v pm2 >/dev/null 2>&1; then
              PM2_CMD="pm2"
            else
              PM2_CMD="npx --yes pm2"
            fi

            cd "$DEPLOY_PATH"

            mkdir -p public/uploads /home/ibgram/logs
            rm -f .env

            # CloudPanel's nginx serves /.well-known/ from the vhost root, not via Next.js.
            # Source lives at public/well-known (no leading dot) because the
            # upload/download-artifact round-trip drops hidden paths intermittently.
            mkdir -p .well-known && cp -a public/well-known/. .well-known/

            echo "Installing dependencies..."
            npm ci --include=dev --legacy-peer-deps

            echo "Generating Prisma client..."
            npx --no-install prisma generate --schema database/prisma/schema.prisma

            if [ -d database/prisma/migrations ] && find database/prisma/migrations -mindepth 1 -maxdepth 1 -type d | grep -q .; then
              echo "Running Prisma migrations..."
              npx --no-install prisma migrate deploy --schema database/prisma/schema.prisma
            else
              # No migration history in this repo, so the schema is synced with
              # `db push`. Audited 2026-10-17: the pending diff is additive only
              # (StudentProfile + DemoRequest, their indexes and FKs), which is
              # what the admin dashboard needs to stop reporting "partial data".
              # NOTE: no --accept-data-loss on purpose. Without it `db push`
              # aborts rather than dropping a column or table, so a future
              # destructive diff fails the deploy instead of eating live data.
              echo "No Prisma migrations directory found; pushing Prisma schema..."
              npx --no-install prisma db push --skip-generate --schema database/prisma/schema.prisma
            fi

            echo "Seeding database..."
            npm run db:seed
            npm run db:seed-cms

            # Use the prebuilt .next shipped from CI. The CI build resolves all
            # CSS deps (shadcn, tw-animate-css) cleanly, and with
            # serverExternalPackages in next.config.ts, Prisma is NOT bundled —
            # so the prebuilt .next loads @prisma/client from the server's own
            # node_modules at runtime (no "@prisma/client-<hash>" mismatch).
            echo "Verifying prebuilt Next.js build shipped from CI..."
            if [ ! -f .next/BUILD_ID ]; then
              echo "ERROR: .next/BUILD_ID missing — prebuilt .next did not arrive."
              echo "Confirm the CI 'Pack build output' step included .next/ in the tarball."
              exit 1
            fi
            echo "Prebuilt .next present (BUILD_ID found)."

            echo "Stopping old PM2 apps and freeing IBGram ports..."
            $PM2_CMD delete all >/dev/null 2>&1 || true
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp >/dev/null 2>&1 || true
              fuser -k "${APP_PORT}/tcp" >/dev/null 2>&1 || true
              fuser -k "${BACKEND_PORT}/tcp" >/dev/null 2>&1 || true
            fi

            echo "Restarting PM2 apps..."
            $PM2_CMD startOrReload ecosystem.config.js --update-env
            $PM2_CMD save

            echo "Waiting for Next.js to start listening on port ${APP_PORT} (up to 120s)..."
            nextjs_home=""
            nextjs_ready=0
            for attempt in $(seq 1 40); do
              if nextjs_home="$(curl -fsS --max-time 5 "http://127.0.0.1:${APP_PORT}/" 2>/dev/null)"; then
                nextjs_ready=1
                echo "Next.js is up after ~$((attempt * 3))s."
                break
              fi
              sleep 3
            done

            if [ "$nextjs_ready" -ne 1 ]; then
              echo "ERROR: Next.js never responded on port ${APP_PORT}. Diagnostics:"
              $PM2_CMD list || true
              echo "--- ibgram-nextjs logs (last 80 lines) ---"
              $PM2_CMD logs ibgram-nextjs --lines 80 --nostream || true
              exit 1
            fi

            if printf '%s' "$nextjs_home" | grep -qi "BoardPeFocus"; then
              echo "ERROR: Port ${APP_PORT} is serving BoardPeFocus instead of IBGram."
              exit 1
            fi

            echo "Checking backend health on port ${BACKEND_PORT} (up to 60s)..."
            backend_ready=0
            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 5 "http://127.0.0.1:${BACKEND_PORT}/health" >/dev/null 2>&1; then
                backend_ready=1
                echo "Backend is up after ~$((attempt * 3))s."
                break
              fi
              sleep 3
            done

            if [ "$backend_ready" -ne 1 ]; then
              echo "ERROR: Backend never responded on port ${BACKEND_PORT}. Diagnostics:"
              $PM2_CMD list || true
              echo "--- ibgram-backend logs (last 80 lines) ---"
              $PM2_CMD logs ibgram-backend --lines 80 --nostream || true
              exit 1
            fi

            echo "Deployment complete."
          REMOTE_SCRIPT
          } | run_remote

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Wait for app to boot
        run: sleep 15

      - name: Check production site
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl -s -L -o "$body_file" -w '%{http_code}' --max-time 30 https://www.ibgram.com/)"
          echo "HTTP status: ${status}"
          if [ "$status" = "403" ]; then
            echo "CloudPanel returned 403. Deploy succeeded, but the public Vhost is not proxying to the Next.js app yet."
            echo "Fix CloudPanel Vhost to proxy / to http://127.0.0.1:${{ env.APP_PORT }}."
            exit 0
          fi
          if [ "$status" != "200" ] && [ "$status" != "301" ] && [ "$status" != "302" ]; then
            exit 1
          fi
          if grep -qi "BoardPeFocus" "$body_file"; then
            echo "Production domain is still serving BoardPeFocus instead of IBGram."
            exit 1
          fi

      # A sitemap full of 404s is worse than no sitemap. On 2026-10-17 the whole
      # /[gurgaonSlug] route 404ed in production while the sitemap still listed
      # ~2,800 of its URLs, and nothing caught it.
      #
      # /sitemap.xml is now a <sitemapindex>, so this walks the index: every child
      # sitemap must itself return 200 and parse, the combined URL count must look
      # like a real site, no URL may appear in two children, and a sample drawn
      # across all of them must render.
      - name: Check sitemap index and pages actually render
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          curl -sf --max-time 60 https://www.ibgram.com/sitemap.xml -o "$work/index.xml"

          if ! grep -q "<sitemapindex" "$work/index.xml"; then
            echo "ERROR: /sitemap.xml is not a <sitemapindex>."
            head -c 400 "$work/index.xml"
            exit 1
          fi

          grep -o "<loc>[^<]*" "$work/index.xml" | sed "s|<loc>||" > "$work/children.txt"
          child_count="$(wc -l < "$work/children.txt")"
          echo "sitemap index lists ${child_count} child sitemaps"
          if [ "$child_count" -lt 2 ]; then
            echo "ERROR: expected several child sitemaps, got ${child_count}."
            exit 1
          fi

          : > "$work/urls.txt"
          while read -r child; do
            [ -n "$child" ] || continue
            status="$(curl -s -o "$work/child.xml" -w "%{http_code}" --max-time 60 "$child")"
            if [ "$status" != "200" ]; then
              echo "ERROR: child sitemap ${child} returned ${status}."
              exit 1
            fi
            if ! grep -q "<urlset" "$work/child.xml"; then
              echo "ERROR: child sitemap ${child} is not a <urlset>."
              exit 1
            fi
            n="$(grep -c "<loc>" "$work/child.xml" || true)"
            echo "  ${status}  ${n} URLs  ${child}"
            grep -o "<loc>[^<]*" "$work/child.xml" | sed "s|<loc>||" >> "$work/urls.txt"
          done < "$work/children.txt"

          total="$(wc -l < "$work/urls.txt")"
          echo "sitemap index covers ${total} URLs"
          if [ "$total" -lt 100 ]; then
            echo "ERROR: sitemap covers only ${total} URLs - expected thousands."
            exit 1
          fi

          # The same URL in two children makes the per-sitemap Search Console counts
          # meaningless, which is the whole reason the set is split.
          dupes="$(sort "$work/urls.txt" | uniq -d | head -20 || true)"
          if [ -n "$dupes" ]; then
            echo "ERROR: these URLs appear in more than one child sitemap:"
            echo "$dupes"
            exit 1
          fi

          failed=0
          for url in $(shuf -n 25 "$work/urls.txt"); do
            status="$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url")"
            echo "  ${status}  ${url}"
            if [ "$status" != "200" ]; then
              failed=$((failed + 1))
            fi
          done

          if [ "$failed" -gt 0 ]; then
            echo "ERROR: ${failed} of 25 sampled sitemap URLs did not return 200."
            exit 1
          fi
          echo "Sitemap index healthy: ${child_count} children, ${total} URLs, 25 sampled all render."
